[project]
name = "berhan-advisor-knowledge-agent"
version = "0.1.0"
description = "Berhan Advisor – conversational legal knowledge agent (FastAPI + LangGraph + Qdrant)"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-cohere>=0.3",
    "langchain-openai>=0.2",
    "langchain-qdrant>=0.2",
    "qdrant-client>=1.11",
    "pydantic-settings>=2.0",
    "jsonschema>=4.0",
    "cohere>=5.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "-q",
]
markers = [
    "manual: opt-in tests requiring live LLM/API (deselect with -m 'not manual')",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/__pycache__/*", "tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85          # minimum coverage threshold — CI will fail below this

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------------------------
# ruff – linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — formatter handles it
    "B008",  # do not perform function calls in default arguments (FastAPI pattern)
    "SIM117", # allow nested with statements for readability
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
